services:
  php:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ghostkey
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno
    ports:
      - "3306:3306"
    volumes:
      - ./ghostkey.sql:/docker-entrypoint-initdb.d/ghostkey.sql:ro
